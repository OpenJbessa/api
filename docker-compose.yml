# ---------------------------------------------------------------------------
# Environnement local : PostgreSQL 16, Redis 7, PHP-FPM et nginx.
#
# Toutes les commandes passent par le service `app` :
#   docker compose exec app composer install
#   docker compose exec app php artisan migrate
#   docker compose exec app php artisan test --compact
#
# nginx partage l'espace réseau de `app` (network_mode: service:app), comme
# les deux conteneurs du pod en production : PHP-FPM n'écoute que sur
# 127.0.0.1:9000 et la configuration nginx est la même partout.
#
# Aucun secret ici : les mots de passe ci-dessous ne protègent que des
# conteneurs locaux jetables.
# ---------------------------------------------------------------------------

name: jbessa-api

services:
  app:
    build:
      context: .
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: jbessa-api:dev
    volumes:
      - .:/var/www/html
    environment:
      PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN:-2}
    # Publié ici et non sur nginx : c'est `app` qui porte l'espace réseau.
    ports:
      - "${APP_PORT:-8000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginxinc/nginx-unprivileged:1.30-alpine
    network_mode: service:app
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # Séquence KEDA en local, à la demande : docker compose --profile stream up -d
  # (après composer install). Pas d'autoscaling ici : pour voir plusieurs
  # consommateurs, `docker compose --profile stream up -d --scale consumer=4`.
  emitter:
    image: jbessa-api:dev
    profiles: [stream]
    command: ["php", "artisan", "demo:emit-events"]
    volumes:
      - .:/var/www/html
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  consumer:
    image: jbessa-api:dev
    profiles: [stream]
    command: ["php", "artisan", "demo:consume-events"]
    volumes:
      - .:/var/www/html
    # Laisse au consommateur le temps de finir son lot sur SIGTERM.
    stop_grace_period: 10s
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    # Mêmes réglages mémoire que gitops/data/redis/redis.conf. volatile-lru :
    # seules les clés à durée de vie (cache, sessions, verrous) sont évinçables ;
    # le stream et les compteurs, sans TTL, ne le sont jamais.
    # Pas de persistance en local.
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
      - --appendonly
      - "no"
      - --save
      - ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres-data:
