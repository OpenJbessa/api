# ---------------------------------------------------------------------------
# nginx devant PHP-FPM, dans le même espace réseau (pod ou compose).
#
# Traefik ne parle pas FastCGI : ce conteneur traduit HTTP en FastCGI et rien
# d'autre. L'API ne sert aucun fichier statique utile, donc tout part vers
# public/index.php, que le fichier existe ou non côté nginx.
# ---------------------------------------------------------------------------

# Chemin demandé, sans chaîne de requête. Ni $uri (réécrit en /index.php par
# try_files) ni $request_uri (qui garde la chaîne de requête).
map $request_uri $api_path {
    ~^(?<path>[^?]*) $path;
}

# Journal d'accès : un événement JSON par ligne sur stderr, comme l'application.
# Ni adresse IP ni chaîne de requête : le retour OAuth y transporte `code` et
# `state`, et l'adresse est une donnée personnelle.
log_format api_json escape=json
    '{"time":"$time_iso8601","source":"nginx","method":"$request_method",'
    '"path":"$api_path","status":$status,"bytes":$body_bytes_sent,'
    '"duration_s":$request_time,"upstream_s":"$upstream_response_time"}';

# Les sondes et la collecte de métriques tournent en boucle : elles noieraient
# le journal sans rien apprendre.
map $api_path $api_loggable {
    /up      0;
    /ready   0;
    /metrics 0;
    default  1;
}

server {
    listen 8080;
    server_name _;

    root /var/www/html/public;

    server_tokens off;
    client_max_body_size 1m;

    access_log /dev/stderr api_json if=$api_loggable;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Métriques : lues par vmagent directement sur le pod. Une requête passée
    # par Traefik porte toujours X-Forwarded-For ; elle n'a rien à faire ici,
    # quelle que soit la règle de routage de l'ingress.
    location = /metrics {
        if ($http_x_forwarded_for) {
            return 404;
        }

        try_files /nonexistent /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;

        # Chemin côté PHP-FPM : nginx n'a pas besoin d'avoir le fichier.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;

        # Légèrement au-delà de request_terminate_timeout (30 s) côté FPM.
        fastcgi_read_timeout 35s;
    }

    # Aucun autre script PHP n'est exécutable, aucun fichier caché n'est servi.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        return 404;
    }
}
