# ---------------------------------------------------------------------------
# Configuration principale du nginx annexe de l'API.
#
# Remplace celle de l'image nginx-unprivileged pour trois raisons : un seul
# worker (worker_processes auto en lancerait un par cœur du nœud, pour une API
# derrière deux workers PHP-FPM), aucune notice sur stderr (seuls les journaux
# JSON y passent), et tout ce qui s'écrit dans /tmp, seul point d'écriture du
# conteneur en lecture seule.
# ---------------------------------------------------------------------------

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
