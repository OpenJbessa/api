; ---------------------------------------------------------------------------
; PHP-FPM — un seul pool, derrière le nginx du même pod.
;
; pm = static : le nombre de processus est fixe, donc la mémoire consommée est
; prévisible. C'est ce qui permet de tenir une limite de pod serrée ; un pool
; dynamique pourrait dépasser la limite sous charge et se faire tuer (OOM).
; ---------------------------------------------------------------------------

[global]
error_log = /proc/self/fd/2
; Les journaux de Laravel sont une ligne JSON par événement, trace d'exception
; comprise : FPM ne doit pas couper une ligne longue en deux.
log_limit = 65536
; Pas les notices de démarrage de FPM : seules ses alertes, qui ne sont pas du
; JSON, restent sur stderr à côté des événements de l'application.
log_level = warning
daemonize = no
; Arrêt sur SIGQUIT (STOPSIGNAL de l'image) : chaque worker termine sa requête
; en cours, dans la limite de ce délai, bien en deçà des 30 s de grâce du pod.
process_control_timeout = 20s

[app]
; Joint uniquement depuis le même espace réseau (pod Kubernetes, ou
; network_mode: service:app en local) : rien n'écoute hors de la boucle locale.
listen = 127.0.0.1:9000

pm = static
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
; Recycle un worker de temps en temps, par précaution contre une fuite mémoire.
pm.max_requests = 500

; La configuration Laravel vient des variables d'environnement du conteneur
; (ConfigMap et Secret) : sans cette ligne, FPM les efface.
clear_env = no

; Les journaux des workers partent tels quels sur stderr, sans préfixe FPM, pour
; rester du JSON valide ligne par ligne.
catch_workers_output = yes
decorate_workers_output = no

; Le journal d'accès est celui de nginx.
access.log = /dev/null

; Coupe une requête bloquée avant le délai de nginx (fastcgi_read_timeout).
request_terminate_timeout = 30s
