; Production : code figé dans l'image, système de fichiers en lecture seule.

opcache.enable = 1
; Les commandes (consommateur, générateur, migrations) n'en profitent pas :
; chaque processus CLI a sa propre mémoire, et le préchargement ne vaut que pour
; PHP-FPM.
opcache.enable_cli = 0

; Le code ne change jamais dans un conteneur : aucune vérification de date.
opcache.validate_timestamps = 0

; Mémoire partagée, comptée dans la limite du pod : dimensionnée d'après
; opcache_get_status() (moins de 30 Mo utilisés, préchargement compris).
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000

; Pas de JIT : l'API attend Redis et PostgreSQL, elle ne calcule pas.
opcache.jit = disable

opcache.preload = /var/www/html/docker/php/preload.php
