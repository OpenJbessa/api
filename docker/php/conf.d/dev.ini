; Développement local uniquement : le code monté change à chaud.

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Les tests et Composer consomment plus que les requêtes HTTP.
memory_limit = 512M
