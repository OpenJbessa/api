; Réglages PHP communs à tous les étages de l'image.

expose_php = Off
memory_limit = 128M
max_execution_time = 30
upload_max_filesize = 1M
post_max_size = 1M

date.timezone = UTC

; Erreurs vers stderr, jamais à l'écran.
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; La session est gérée par Laravel (Redis), pas par PHP.
session.auto_start = 0
